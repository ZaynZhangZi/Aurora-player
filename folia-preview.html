<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Folia 八套主题预览 · Aurora</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f172a; }
    #preview { position: fixed; inset: 0; }
    .preview-settings { position: fixed; right: 24px; top: 46px; z-index: 80; display: flex; gap: 8px; color: #cbd5e1; font: 12px system-ui; }
    .preview-settings select { width: 106px; padding: 10px 12px; border: 1px solid #ffffff20; border-radius: 24px; background: #101827dd; color: #e2e8f0; cursor: pointer; }
    .preview-settings #background { width: 180px; max-width: calc(100vw - 138px); }
    .preview-note { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 80; color: #ffffff55; font: 11px system-ui; pointer-events: none; white-space: nowrap; }
    .preview-settings select:focus-visible { outline: 2px solid #fbbf24; outline-offset: 4px; }
    @media (max-width: 639px) { .preview-settings { right: 12px; } }
  </style>
</head>
<body>
  <div id="preview" class="folia-surface" data-folia-surface></div>
  <span class="preview-note">八套主题动态预览 · 无真实音频</span>
  <div class="preview-settings"><select id="background" aria-label="切换预览背景"></select><select id="theme" aria-label="切换预览主题"></select></div>
  <script type="module">
    // Development preview: uses the production render bridge, without login or a music backend.
    import '/src/index.css'
    import {createFoliaRenderer} from '/src/components/globalFooterPlayer/folia/createFoliaRenderer.js'
    import {toFoliaLines} from '/src/utils/player/foliaTimeline.js'
    import {PLAYER_APPEARANCE_OPTIONS} from '/src/utils/player/playerAppearance.js'
    import {FOLIA_BACKGROUND_OPTIONS} from '/src/utils/player/foliaBackground.js'
    const select = document.querySelector('#theme')
    const backgroundSelect = document.querySelector('#background')
    for (const option of FOLIA_BACKGROUND_OPTIONS) backgroundSelect.add(new Option(option.label, option.id))
    for (const option of PLAYER_APPEARANCE_OPTIONS.filter(option => option.id !== 'amll')) select.add(new Option(option.label, option.id))
    select.value = 'manuscript'
    const texts = ['把纷扰留在窗外', '让音乐拥抱此刻', '就让时间慢一些走', '听见风也听见你', '每一句都留下回声', '这一刻是我们的歌', '愿星光落在你肩上', '在旋律里再次相遇']
    const raw = texts.map((text, index) => ({startTime: index * 10000, endTime: (index + 1) * 10000, translatedLyric: 'Let the music hold this moment.',
      words: Array.from(text, (word, i) => ({word, startTime: index * 10000 + i * 10000 / text.length, endTime: index * 10000 + (i + 1) * 10000 / text.length}))}))
    const artwork = '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><defs><linearGradient id="a" x2="1" y2="1"><stop stop-color="#798db9"/><stop offset="1" stop-color="#343653"/></linearGradient></defs><rect width="600" height="600" fill="url(#a)"/><circle cx="300" cy="240" r="125" fill="#eacdad" opacity=".5"/><path d="M0 390Q160 270 300 400T600 370V600H0" fill="#273444"/><text x="300" y="520" fill="#eae4d8" font-size="34" text-anchor="middle" letter-spacing="9">AURORA</text></svg>'
    let baseTime = 12500, startedAt = performance.now(), playing = true, disposed = false
    const clock = () => (baseTime + (playing ? performance.now() - startedAt : 0)) % 80000
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)')
    const options = {mode: select.value, backgroundMode: backgroundSelect.value, musicName: '音乐的形状 · 主题预览', trackKey: 'folia-preview', artistNames: 'Aurora',
      cover: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(artwork), lines: toFoliaLines(raw),
      currentTimeMs: baseTime, duration: 80000, playing, clock, lyricLeadMs: 320, reducedMotion: reducedMotion.matches,
      playMode: 'sequence', canPrev: false, canNext: false,
      // Match upstream useVisPlaygroundPreviewPlayback's calm preview signals.
      bands: () => {const now = performance.now(); const wave = (offset, speed, floor, amplitude) => floor + (Math.sin(now * speed + offset) * 0.5 + 0.5) * amplitude;
        return {power: wave(.2, .0024, .16, .18), bass: wave(.9, .0032, .14, .2), lowMid: wave(1.7, .0028, .12, .16),
          mid: wave(2.6, .0023, .1, .14), vocal: wave(3.4, .0038, .16, .22), treble: wave(4.2, .0046, .08, .14)}},
      onTogglePlay: () => {baseTime = clock(); startedAt = performance.now(); playing = !playing; options.playing = playing; options.currentTimeMs = baseTime; renderer.update(options)},
      onSeek: ms => {baseTime = Math.max(0, Math.min(79999, ms)); startedAt = performance.now(); options.currentTimeMs = baseTime; renderer.update(options)},
      onCycleRepeat: () => {}, onPlaylist: () => {}, onPrev: () => {}, onNext: () => {},
      onClose: () => location.assign('/'), onError: error => console.error(error),
    }
    const renderer = createFoliaRenderer(document.querySelector('#preview'), options)
    select.addEventListener('change', () => {options.mode = select.value; options.currentTimeMs = clock(); renderer.update(options)})
    backgroundSelect.addEventListener('change', () => {options.backgroundMode = backgroundSelect.value; options.currentTimeMs = clock(); renderer.update(options)})
    reducedMotion.addEventListener('change', () => {options.reducedMotion = reducedMotion.matches; renderer.update(options)})
    addEventListener('pagehide', () => {if (!disposed) {disposed = true; renderer.dispose()}}, {once: true})
  </script>
</body>
</html>
